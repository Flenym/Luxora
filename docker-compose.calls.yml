name: luxora-calls

# Local infrastructure harness only. It proves that the selected SFU/TURN
# components can be configured together; it is not a working Luxora call API.
services:
  sfu:
    image: livekit/livekit-server:v1.13.5@sha256:3497163e15c48fef6e7830c78716f9e9d5edc28abf7aa90b61c86e93bbc306b1
    command: ["--node-ip", "${CALLS_NODE_IP:-172.31.80.10}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          strict_acks: true
          data_channel_max_buffered_amount: 16777216
          turn_servers:
            - host: "${TURN_PUBLIC_HOST:-127.0.0.1}"
              port: ${TURN_PORT:-3478}
              protocol: udp
              secret: "${TURN_SHARED_SECRET:?TURN_SHARED_SECRET is required}"
              ttl: 300
            - host: "${TURN_PUBLIC_HOST:-127.0.0.1}"
              port: ${TURN_PORT:-3478}
              protocol: tcp
              secret: "${TURN_SHARED_SECRET:?TURN_SHARED_SECRET is required}"
              ttl: 300
        prometheus:
          port: 6789
        room:
          auto_create: false
          empty_timeout: 60
          departure_timeout: 20
          max_participants: 50
          enabled_codecs:
            - mime: audio/opus
            - mime: video/h264
            - mime: video/vp8
          enable_remote_unmute: false
        logging:
          level: info
          json: true
          sample: false
        # Deliver participant/room lifecycle events to the API so call state can
        # move connecting -> active and end on media-plane disconnects. The API
        # verifies the short-lived LiveKit signature with the API key/secret.
        webhook:
          api_key: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}"
          urls:
            - ${CALLS_WEBHOOK_URL:-http://host.docker.internal:2222/v1/internal/calls/livekit-webhook}
        limit:
          max_metadata_size: 16384
          max_attributes_size: 16384
          max_room_name_length: 128
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    ports:
      - "127.0.0.1:7880:7880/tcp"
      - "127.0.0.1:7881:7881/tcp"
      - "127.0.0.1:7882:7882/udp"
      - "127.0.0.1:6789:6789/tcp"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:7880"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      turn:
        condition: service_healthy
    networks:
      calls:
        ipv4_address: 172.31.80.10

  turn:
    # Local development harness only (never shipped to users). Built locally
    # from the pinned Alpine 3.24.3 base because the published coturn alpine
    # tags still bundle brotli-libs 1.2.0-r1, which Trivy flags as CRITICAL
    # (CVE-2026-111497, fixed in 1.2.1-r0). See tools/coturn/Dockerfile.
    build:
      context: .
      dockerfile: tools/coturn/Dockerfile
    image: luxora-turn:local
    # TURN must bind 3478 (<1024); with cap_drop ALL a non-root process cannot
    # acquire NET_BIND_SERVICE. Run this local-only relay as root inside the
    # container while the bounding set stays empty apart from NET_BIND_SERVICE
    # (read-only rootfs, no new privileges, loopback-published ports).
    user: "0:0"
    command:
      - --listening-ip=0.0.0.0
      - --relay-ip=172.31.80.20
      - --external-ip=${TURN_PUBLIC_IP:-127.0.0.1}/172.31.80.20
      - --listening-port=${TURN_PORT:-3478}
      - --min-port=${TURN_RELAY_MIN_PORT:-49160}
      - --max-port=${TURN_RELAY_MAX_PORT:-49200}
      - --realm=${TURN_REALM:-calls.luxora.local}
      - --server-name=${TURN_REALM:-calls.luxora.local}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?TURN_SHARED_SECRET is required}
      - --fingerprint
      - --no-multicast-peers
      - --allowed-peer-ip=172.31.80.10
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --no-tls
      - --no-dtls
      - --log-file=stdout
      - --simple-log
      - --pidfile=/tmp/turnserver.pid
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    ports:
      - "127.0.0.1:${TURN_PORT:-3478}:${TURN_PORT:-3478}/udp"
      - "127.0.0.1:${TURN_PORT:-3478}:${TURN_PORT:-3478}/tcp"
      - "127.0.0.1:${TURN_RELAY_MIN_PORT:-49160}-${TURN_RELAY_MAX_PORT:-49200}:${TURN_RELAY_MIN_PORT:-49160}-${TURN_RELAY_MAX_PORT:-49200}/udp"
    healthcheck:
      # tools/coturn/Dockerfile installs bash; busybox sh has no /dev/tcp.
      test: ["CMD", "/bin/bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/${TURN_PORT:-3478}; exec 3>&-"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The official binary cannot exec after the capability bounding set is
      # emptied; retain only this image-declared file-capability dependency.
      - NET_BIND_SERVICE
    networks:
      calls:
        ipv4_address: 172.31.80.20

  # Local-only TLS terminator so CALLS_LIVEKIT_URL can be wss:// (required by
  # the API). Self-signed internal CA; development harness only.
  tls:
    image: caddy:2.8-alpine
    volumes:
      - ./infra/calls/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "127.0.0.1:7443:7443/tcp"
    depends_on:
      sfu:
        condition: service_started
    networks:
      calls:
        ipv4_address: 172.31.80.30
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  caddy-data:
  caddy-config:

networks:
  calls:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.80.0/24
