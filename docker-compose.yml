name: luxora

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - ${LUXORA_ENV_FILE:-.env}
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    volumes:
      - luxora_api_data:/app/data
    ports:
      - "127.0.0.1:${LUXORA_API_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app
      - observability

  otp-console:
    profiles: ["development"]
    build:
      context: .
      dockerfile: tools/otp-console/Dockerfile
    environment:
      NODE_ENV: development
      LUXORA_LOCAL_OTP_CONSOLE: enabled
      PHONE_AUTH_PROVIDER: ${PHONE_AUTH_PROVIDER:-disabled}
      PHONE_AUTH_DEVELOPMENT_CODE: ${PHONE_AUTH_DEVELOPMENT_CODE:-}
      LUXORA_OTP_CONSOLE_PUBLIC_PORT: ${LUXORA_OTP_CONSOLE_HOST_PORT:-8081}
      PORT: "8081"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777,noexec,nosuid,nodev
    ports:
      - "127.0.0.1:${LUXORA_OTP_CONSOLE_HOST_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8081/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 3s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      - developer-tools

  prometheus:
    image: prom/prometheus:v3.13.2-distroless@sha256:64f71bb84e03c855948418b0fc5dea53e9543d8e3fc9931598f583805507f05e
    profiles: ["observability"]
    init: true
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - luxora_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "/bin/promtool", "query", "instant", "http://127.0.0.1:9090", "vector(1)"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - observability

volumes:
  luxora_api_data:
  luxora_prometheus_data:

networks:
  app:
    internal: false
  observability:
    internal: true
  developer-tools: {}
