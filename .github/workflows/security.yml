name: Security and container

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # CodeQL was suspended while the repository was private, because the private
  # repository had no GitHub Advanced Security license, so SARIF upload was
  # rejected and the analyze step always failed on repository permissions.
  # The repository is public now, so code scanning with the GitHub-provided
  # CodeQL toolchain is free again and this job is re-enabled with advanced
  # setup (CodeQL default setup is not configured for this repository).
  # javascript-typescript is the only language CodeQL needs to cover here:
  # the Node API and React apps are JavaScript/TypeScript. Build output
  # (node_modules/dist/coverage) is excluded from analysis.
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths-ignore:
              - "**/node_modules/**"
              - "**/dist/**"
              - "**/build/**"
              - "**/coverage/**"
              - "**/*.min.js"
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:javascript-typescript"

  filesystem-and-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Install ripgrep for infrastructure validation
        run: |
          set -euo pipefail
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet ripgrep
          rg --version | head --lines=1
      - name: Validate local infrastructure definitions
        run: make check-truth compose-config calls-config compose-security-check prometheus-check
      - name: Smoke local calls infrastructure
        run: make calls-smoke
      - name: Scan repository and infrastructure
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          version: v0.73.0
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
      - name: Build API image
        run: docker build --pull --file services/api/Dockerfile --tag luxora-api:${{ github.sha }} .
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: luxora-api:${{ github.sha }}
          scanners: vuln,secret
          version: v0.73.0
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
      - name: Build local OTP console image
        run: docker build --pull --file tools/otp-console/Dockerfile --tag luxora-otp-console:${{ github.sha }} .
      - name: Scan local OTP console image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: luxora-otp-console:${{ github.sha }}
          scanners: vuln,secret
          version: v0.73.0
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
      # Pinned third-party infrastructure images are internal-only tooling
      # (monitoring/SFU/TURN); they are never shipped to users. Upstream Go
      # dependencies (e.g. golang.org/x/crypto in Prometheus v3.14.0) are
      # patched on the vendors' release cadence, so these scans fail on
      # CRITICAL only, while the user-facing API image keeps CRITICAL+HIGH.
      - name: Scan pinned Prometheus image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: prom/prometheus:v3.14.0-distroless@sha256:50c707e96da5ade383cb1707790576480485e93de06aa60ad8802cb5f744bd0a
          scanners: vuln,secret
          version: v0.73.0
          format: table
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Scan pinned LiveKit image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: livekit/livekit-server:v1.13.5@sha256:3497163e15c48fef6e7830c78716f9e9d5edc28abf7aa90b61c86e93bbc306b1
          scanners: vuln,secret
          version: v0.73.0
          format: table
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Scan pinned coturn image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Local-dev harness only. The stable alpine tags still ship brotli
          # 1.2.0-r1 (CVE-2026-111497, CRITICAL); this 2026-10-31 edge-alpine
          # digest is built on Alpine 3.24.3 and scans clean. Rotate to the
          # next stable release once upstream rebuilds on the patched base.
          image-ref: coturn/coturn:edge-alpine@sha256:fe2423b3c9b0a8d919c89908e254ea93aaf028e98d3e34f31bc940e9f0ed58f2
          scanners: vuln,secret
          version: v0.73.0
          format: table
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: "1"
