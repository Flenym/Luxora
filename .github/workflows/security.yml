name: Security and container

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@e60ea984bd3baa95954f2856bcf24f9eaba46637 # v3.37.5
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@e60ea984bd3baa95954f2856bcf24f9eaba46637 # v3.37.5
        with:
          # The private repository has no Advanced Security license, so SARIF
          # upload is rejected. Keep the local query evaluation (extraction
          # errors still fail the build) and skip the code-scanning upload.
          upload: false

  filesystem-and-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Install ripgrep for infrastructure validation
        run: |
          set -euo pipefail
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet ripgrep
          rg --version | head --lines=1
      - name: Validate local infrastructure definitions
        run: make check-truth compose-config calls-config compose-security-check prometheus-check
      - name: Smoke local calls infrastructure
        run: make calls-smoke
      - name: Scan repository and infrastructure
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          version: v0.73.0
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
      - name: Build API image
        run: docker build --pull --file services/api/Dockerfile --tag luxora-api:${{ github.sha }} .
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: luxora-api:${{ github.sha }}
          scanners: vuln,secret
          version: v0.73.0
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
      - name: Build local OTP console image
        run: docker build --pull --file tools/otp-console/Dockerfile --tag luxora-otp-console:${{ github.sha }} .
      - name: Scan local OTP console image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: luxora-otp-console:${{ github.sha }}
          scanners: vuln,secret
          version: v0.73.0
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
      - name: Scan pinned Prometheus image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: prom/prometheus:v3.13.2-distroless@sha256:64f71bb84e03c855948418b0fc5dea53e9543d8e3fc9931598f583805507f05e
          scanners: vuln,secret
          version: v0.73.0
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
      - name: Scan pinned LiveKit image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: livekit/livekit-server:v1.13.5@sha256:3497163e15c48fef6e7830c78716f9e9d5edc28abf7aa90b61c86e93bbc306b1
          scanners: vuln,secret
          version: v0.73.0
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
      - name: Scan pinned coturn image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: coturn/coturn:4.16.0-alpine3.24@sha256:901954a6b057079e1b12b2e4b4de06e3419e503336ba76c18f62debca3ac4b42
          scanners: vuln,secret
          version: v0.73.0
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
