<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Luxora · Звонки</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; background: #0b0b10; color: #eee; min-height: 100vh; box-sizing: border-box; }
  h1 { font-size: 22px; margin: 8px 0 12px; }
  .card { background: #17171f; border-radius: 14px; padding: 14px; margin: 10px 0; }
  input { font-size: 17px; padding: 12px; width: 100%; box-sizing: border-box; margin: 5px 0; border-radius: 10px; border: 1px solid #333; background: #101016; color: #eee; }
  button { font-size: 17px; padding: 13px 16px; margin: 6px 0; border-radius: 12px; border: 0; width: 100%; background: #2a2a36; color: #eee; }
  button.primary { background: #2fb36b; color: #fff; }
  button.danger { background: #d9534f; color: #fff; }
  .muted { color: #9a9aa6; font-size: 14px; }
  .row { display: flex; gap: 8px; }
  .row > button { width: auto; flex: 1; }
  #status { font-size: 15px; color: #cfe; min-height: 20px; margin: 8px 0; white-space: pre-wrap; }
  #error { color: #ff8a80; font-size: 15px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="app"></div>
<audio id="remote-audio" autoplay playsinline></audio>
<script type="module">
import { Room } from "https://cdn.jsdelivr.net/npm/livekit-client@2/+esm";

// Luxora API base. Override with ?api=https://... when testing another server.
const API = new URLSearchParams(location.search).get("api") || "https://luxora.cloudpub.ru";
const app = document.getElementById("app");
const remoteAudio = document.getElementById("remote-audio");

let session = JSON.parse(sessionStorage.getItem("luxora-call-session") || "null");
let chats = [];
let incoming = null;      // call the user is being rung for
let call = null;          // call the user is in (created or accepted)
let room = null;          // LiveKit room while connected
let pollTimer = null;
let status = "";
let error = "";

async function api(method, path, body) {
  const headers = { "Content-Type": "application/json" };
  if (session) headers.Authorization = "Bearer " + session.token;
  const res = await fetch(API + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  const text = await res.text();
  const json = text ? JSON.parse(text) : null;
  if (!res.ok) {
    const message = json?.error?.message || ("Ошибка " + res.status);
    const err = new Error(message);
    err.status = res.status;
    throw err;
  }
  return json;
}

function esc(value) {
  return String(value).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function setStatus(text) { status = text; render(); }
function setError(text) { error = text || ""; render(); }

async function run(action) {
  error = "";
  try { await action(); } catch (e) { error = e.message || String(e); render(); }
}

// ---------- views ----------

function loginView() {
  app.innerHTML = `
    <h1>Luxora · Звонки</h1>
    <div class="card">
      <input id="u" placeholder="Логин" autocomplete="username" autocapitalize="none">
      <input id="p" type="password" placeholder="Пароль" autocomplete="current-password">
      <button class="primary" id="login">Войти</button>
      <button id="register">Регистрация</button>
      <div id="error">${esc(error)}</div>
    </div>`;
  document.getElementById("login").onclick = () => run(() => signIn("login"));
  document.getElementById("register").onclick = () => run(() => signIn("register"));
}

function mainView() {
  const incomingCard = incoming ? `
    <div class="card">
      <div><b>Входящий звонок</b></div>
      <div class="muted">${esc(incoming.chatTitle)}</div>
      <div class="row">
        <button class="danger" id="decline">Отклонить</button>
        <button class="primary" id="accept">Принять</button>
      </div>
    </div>` : "";
  const activeCard = call ? `
    <div class="card">
      <div><b>${esc(stateTitle(call.state))}</b></div>
      <div class="muted">${esc(status || "")}</div>
      <button class="danger" id="hangup">Завершить</button>
    </div>` : "";
  const chatList = chats.length ? chats.map((c) => `
    <div class="card">
      <div><b>${esc(c.title)}</b></div>
      <button class="primary" data-chat="${esc(c.id)}" ${call || incoming ? "disabled" : ""}>Позвонить</button>
    </div>`).join("") : `<div class="muted">Личных чатов пока нет. Они появятся после принятия запроса переписки в приложении Luxora.</div>`;

  app.innerHTML = `
    <div class="row"><h1 style="flex:1">${esc(session.user.displayName)}</h1><button id="logout" style="width:auto">Выйти</button></div>
    ${incomingCard}${activeCard}
    <div class="muted">Личные чаты</div>
    ${chatList}
    <div id="error">${esc(error)}</div>`;

  document.getElementById("logout")?.addEventListener("click", logout);
  document.getElementById("accept")?.addEventListener("click", () => run(acceptIncoming));
  document.getElementById("decline")?.addEventListener("click", () => run(declineIncoming));
  document.getElementById("hangup")?.addEventListener("click", () => run(hangUp));
  app.querySelectorAll("button[data-chat]").forEach((b) => b.addEventListener("click", () => run(() => startCall(b.dataset.chat))));
}

function stateTitle(state) {
  return ({
    created: "Вызов…", inviting: "Вызов…", ringing: "Звонит", connecting: "Подключение…",
    active: "Разговор", reconnecting: "Переподключение…", ending: "Завершение…", ended: "Звонок завершён",
  })[state] || state;
}

function render() {
  if (!session) loginView(); else mainView();
}

// ---------- auth ----------

async function signIn(mode) {
  const username = document.getElementById("u").value.trim();
  const password = document.getElementById("p").value;
  const deviceName = (navigator.userAgent || "Browser").slice(0, 120);
  const path = mode === "login" ? "/v1/auth/login" : "/v1/auth/register";
  const body = mode === "login"
    ? { username, password, deviceName }
    : { username, displayName: username, password, deviceName };
  const result = await api("POST", path, body);
  session = { user: result.user, token: result.tokens.accessToken };
  sessionStorage.setItem("luxora-call-session", JSON.stringify(session));
  await refresh();
  startPolling();
}

function logout() {
  stopPolling();
  leaveRoom();
  session = null; call = null; incoming = null; chats = [];
  sessionStorage.removeItem("luxora-call-session");
  render();
}

// ---------- data ----------

async function refresh() {
  if (!session) return;
  const list = await api("GET", "/v1/chats?limit=100");
  chats = list.items
    .filter((c) => c.kind === "direct")
    .map((c) => ({ id: c.id, title: c.title }));
  render();
}

async function findIncoming() {
  // An incoming call is a live call where I am not the creator and my participant is still invited/ringing.
  for (const chat of chats) {
    const { calls } = await api("GET", "/v1/calls?chatId=" + chat.id);
    const live = calls.find((c) => isLive(c.state) && c.creatorMemberId !== session.user.id
      && c.participants.some((p) => p.memberId === session.user.id && (p.status === "invited" || p.status === "ringing")));
    if (live) return { callId: live.callId, chatTitle: chat.title, chatId: chat.id };
  }
  return null;
}

function isLive(state) {
  return ["created", "inviting", "ringing", "connecting", "active", "reconnecting", "ending"].includes(state);
}

// ---------- call flow ----------

async function startCall(chatId) {
  const nonce = crypto.randomUUID();
  const created = (await api("POST", "/v1/calls", { chatId, mediaMode: "audio", clientNonce: nonce })).call;
  const ringed = (await api("POST", `/v1/calls/${created.callId}/ring`, { expectedRevision: created.revision })).call;
  call = ringed;
  setStatus("Вызываем собеседника…");
  startPolling();
}

async function acceptIncoming() {
  const fresh = (await api("GET", `/v1/calls/${incoming.callId}`)).call;
  call = (await api("POST", `/v1/calls/${fresh.callId}/accept`, { expectedRevision: fresh.revision })).call;
  incoming = null;
  setStatus("Подключаем микрофон…");
  render();
}

async function declineIncoming() {
  const fresh = (await api("GET", `/v1/calls/${incoming.callId}`)).call;
  await api("POST", `/v1/calls/${fresh.callId}/decline`, { expectedRevision: fresh.revision, reason: "declined" });
  incoming = null;
  render();
}

async function hangUp() {
  if (call) {
    const fresh = (await api("GET", `/v1/calls/${call.callId}`)).call;
    await api("POST", `/v1/calls/${fresh.callId}/hangup`, { expectedRevision: fresh.revision, scope: "self" }).catch(() => undefined);
  }
  await leaveRoom();
  call = null;
  setStatus("");
  render();
}

async function joinMedia(callId) {
  const grant = await api("POST", `/v1/calls/${callId}/join-grant`, { requestedSources: ["microphone"] });
  room = new Room();
  room.on("trackSubscribed", (track) => {
    if (track.kind === "audio") { track.attach(remoteAudio); setStatus("Голос собеседника слышен"); }
  });
  room.on("disconnected", () => { room = null; });
  await room.connect(grant.serverUrl, grant.token);
  await room.localParticipant.setMicrophoneEnabled(true);
  setStatus("Вы в звонке. Говорите.");
}

async function leaveRoom() {
  if (room) { const r = room; room = null; await r.disconnect().catch(() => undefined); }
}

async function tick() {
  try {
    if (!session) return;
    if (call) {
      const fresh = (await api("GET", `/v1/calls/${call.callId}`)).call;
      call = fresh;
      if (!isLive(fresh.state)) { await leaveRoom(); call = null; setStatus(""); }
      else if (["connecting", "active", "reconnecting"].includes(fresh.state) && !room) {
        await joinMedia(fresh.callId).catch((e) => setError("Микрофон: " + e.message));
      } else if (fresh.state === "ringing" || fresh.state === "inviting") {
        setStatus("Звонит собеседнику…");
      }
    } else if (!incoming) {
      const found = await findIncoming();
      if (found) incoming = found;
    }
    render();
  } catch (e) {
    if (e.status === 401) logout(); else setError(e.message);
  }
}

function startPolling() {
  if (!pollTimer) pollTimer = setInterval(tick, 2000);
}
function stopPolling() {
  clearInterval(pollTimer); pollTimer = null;
}

// ---------- start ----------

if (session) {
  refresh().then(() => startPolling()).catch((e) => { session = null; sessionStorage.removeItem("luxora-call-session"); setError(e.message); render(); });
} else {
  render();
}
</script>
</body>
</html>
